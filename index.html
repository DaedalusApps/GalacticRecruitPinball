<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="description" content="Galactic Recruit Pinball - Space Invaders themed 3D Pinball" />
    <meta name="theme-color" content="#050508" />
    <title>Galactic Recruit Pinball</title>
    <style>
      :root {
        --color-bg: #050508;
        --color-neon-green: #00ff66;
        --color-neon-cyan: #00e5ff;
        --color-neon-pink: #ff007f;
        --color-hud-border: #1a233a;
        --font-mono: 'Courier New', Courier, monospace;
      }

      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
        user-select: none;
        -webkit-user-select: none;
        touch-action: none;
      }

      html, body {
        width: 100%;
        height: 100%;
        overflow: hidden;
        background-color: var(--color-bg);
        color: #ffffff;
        font-family: var(--font-mono);
      }

      #app {
        position: relative;
        width: 100vw;
        height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        background: radial-gradient(circle at center, #0a0f1d 0%, #030408 100%);
      }

      #game-container {
        position: relative;
        width: 100%;
        height: 100%;
        display: flex;
        justify-content: center;
        align-items: center;
      }

      canvas#pinball-canvas {
        display: block;
        width: 100%;
        height: 100%;
        outline: none;
      }

      #hud-overlay {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        pointer-events: none;
        display: flex;
        flex-direction: column;
        justify-content: space-between;
        padding: 12px;
      }

      .hud-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        background: rgba(5, 8, 16, 0.85);
        border: 1px solid var(--color-hud-border);
        border-radius: 4px;
        padding: 8px 16px;
        box-shadow: 0 0 10px rgba(0, 229, 255, 0.2);
        pointer-events: auto;
      }

      .hud-title {
        color: var(--color-neon-green);
        font-size: 1rem;
        font-weight: bold;
        letter-spacing: 2px;
        text-shadow: 0 0 8px rgba(0, 255, 102, 0.6);
      }

      .hud-info {
        display: flex;
        gap: 16px;
        font-size: 0.85rem;
        color: var(--color-neon-cyan);
      }

      .hud-info span {
        color: #ffffff;
      }
    </style>
  </head>
  <body>
    <div id="app">
      <div id="game-container">
        <canvas id="pinball-canvas"></canvas>
        <div id="hud-overlay">
          <header class="hud-header">
            <div class="hud-title">GALACTIC RECRUIT</div>
            <div class="hud-info">
              <div>SCORE: <span id="score-display">000,000</span></div>
              <div>MULT: <span id="mult-display">1X</span></div>
              <div>BALL: <span id="ball-display">1</span></div>
              <div>RANK: <span id="rank-display">ROOKIE DEFENDER</span></div>
            </div>
          </header>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
